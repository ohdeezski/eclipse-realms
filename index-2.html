<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Eclipse Realms Prototype v0.0.1</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
#ui{padding:8px;background:#222}
canvas{display:block;margin:auto;border:1px solid #555;background:#3d7c47}
</style>
</head>
<body>
<div id="ui">
<b>Eclipse Realms Prototype v0.0.1</b> |
Move: WASD / Arrow Keys |
Goal: Reach the golden shrine.
</div>
<canvas id="c" width="800" height="600"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const p={x:80,y:300,s:22,speed:3,xp:0};
const goal={x:700,y:80,s:28};
const keys={};
addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);
function update(){
 if(keys.w||keys.ArrowUp)p.y-=p.speed;
 if(keys.s||keys.ArrowDown)p.y+=p.speed;
 if(keys.a||keys.ArrowLeft)p.x-=p.speed;
 if(keys.d||keys.ArrowRight)p.x+=p.speed;
 p.x=Math.max(0,Math.min(c.width-p.s,p.x));
 p.y=Math.max(0,Math.min(c.height-p.s,p.y));
 if(Math.abs(p.x-goal.x)<24&&Math.abs(p.y-goal.y)<24){
   p.xp=10;
 }
}
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle="#2d5";
 ctx.fillRect(0,0,c.width,c.height);
 ctx.fillStyle="#4a341d";
 ctx.fillRect(0,560,800,40);
 ctx.fillStyle="#00b7ff";
 ctx.fillRect(p.x,p.y,p.s,p.s);
 ctx.fillStyle="gold";
 ctx.fillRect(goal.x,goal.y,goal.s,goal.s);
 ctx.fillStyle="white";
 ctx.fillText("Player XP: "+p.xp,10,20);
 if(p.xp>0){
   ctx.font="24px Arial";
   ctx.fillText("Quest Complete! Prototype Goal Reached.",180,300);
 }
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
