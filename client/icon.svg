<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f17;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eclipseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bgGrad)"/>
  <circle cx="128" cy="128" r="90" fill="none" stroke="url(#eclipseGrad)" stroke-width="8" stroke-dasharray="565.48 565.48" stroke-dashoffset="141.37">
    <animate attributeName="stroke-dashoffset" from="565.48" to="0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="128" cy="128" r="60" fill="url(#eclipseGrad)" opacity="0.3">
    <animate attributeName="r" from="40" to="70" dur="2s" repeatCount="indefinite" attributeType="XML"/>
    <animate attributeName="opacity" from="0.1" to="0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="128" y="140" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="url(#eclipseGrad)" text-anchor="middle" dominant-baseline="middle">ER</text>
</svg>