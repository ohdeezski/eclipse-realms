name: Godot Export

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4
  EXPORT_NAME: eclipse-realms

jobs:
  export-linux:
    name: Export Linux/X11
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Godot export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/linux_x11_64_release.apk ]; then
            wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            tar -xzf Godot_v${GODOT_VERSION}-stable_export_templates.tpz -C /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi
          ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      
      - name: Export Linux/X11
        working-directory: ./client
        run: |
          godot --headless --export-release "Linux/X11" build/desktop/${EXPORT_NAME}.x86_64
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-realms-linux
          path: client/build/desktop/${{ env.EXPORT_NAME }}.x86_64
          retention-days: 7

  export-windows:
    name: Export Windows Desktop
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Godot export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/linux_x11_64_release.apk ]; then
            wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            tar -xzf Godot_v${GODOT_VERSION}-stable_export_templates.tpz -C /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi
          ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      
      - name: Install Wine for Windows export
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y wine64 wine32
      
      - name: Export Windows Desktop
        working-directory: ./client
        run: |
          godot --headless --export-release "Windows Desktop" build/desktop/${EXPORT_NAME}.exe
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-realms-windows
          path: client/build/desktop/${{ env.EXPORT_NAME }}.exe
          retention-days: 7

  export-web:
    name: Export Web
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Godot export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/linux_x11_64_release.apk ]; then
            wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            tar -xzf Godot_v${GODOT_VERSION}-stable_export_templates.tpz -C /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi
          ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      
      - name: Export Web
        working-directory: ./client
        run: |
          godot --headless --export-release "Web" build/web/index.html
      
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-realms-web
          path: client/build/web/
          retention-days: 7

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Boot smoke (project loads, autoloads init)
        working-directory: ./client
        run: |
          godot --headless --path . --quit 2>&1
      
      - name: Run test_runner (core assertions; fails build on any failure)
        working-directory: ./client
        run: |
          godot --headless --path . -s res://tests/test_runner.gd 2>&1
      
      - name: Run comprehensive_validation (no false positives)
        working-directory: ./client
        run: |
          godot --headless -s res://tests/comprehensive_validation.gd 2>&1
      
      - name: Run multiplayer integration test
        working-directory: ./client
        run: |
          godot --headless -s res://tests/test_multiplayer_integration.gd 2>&1