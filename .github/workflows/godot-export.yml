name: Godot Export

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4
  EXPORT_NAME: eclipse-realms

jobs:
  export-linux:
    name: Export Linux/X11
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    env:
      EXPECTED_TEMPLATE: linux_release.x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Godot export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/${EXPECTED_TEMPLATE} ]; then
            echo "Downloading Godot ${GODOT_VERSION} export templates..."
            curl -fSL -o Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
              || { echo "FAILED: curl exit code $?"; ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/; exit 1; }
            echo "Verifying ZIP archive..."
            unzip -tq Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            echo "Extracting..."
            unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
            test -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt
            test -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/${EXPECTED_TEMPLATE}
          else
            echo "Export templates already present, skipping download."
            ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi
      
      - name: Export Linux/X11
        working-directory: ./client
        run: |
          godot --headless --export-release "Linux/X11" build/desktop/${EXPORT_NAME}.x86_64

      - name: Smoke-test Linux artifact
        working-directory: ./client
        run: |
          build/desktop/${EXPORT_NAME}.x86_64 --headless --quit

      - name: Generate Linux release manifest
        run: |
          bash tools/ci/generate_release_manifest.sh "Linux/X11" client/build/desktop client/build/desktop/release-manifest-linux.json
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-realms-linux
          path: client/build/desktop/
          retention-days: 7

  export-windows:
    name: Export Windows Desktop
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    env:
      EXPECTED_TEMPLATE: windows_release_x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Godot export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/${EXPECTED_TEMPLATE} ]; then
            echo "Downloading Godot ${GODOT_VERSION} export templates..."
            curl -fSL -o Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
              || { echo "FAILED: curl exit code $?"; ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/; exit 1; }
            echo "Verifying ZIP archive..."
            unzip -tq Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            echo "Extracting..."
            unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
            test -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt
            test -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/${EXPECTED_TEMPLATE}
          else
            echo "Export templates already present, skipping download."
            ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi
      
      - name: Install Wine for Windows export
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y wine64 wine32
      
      - name: Export Windows Desktop
        working-directory: ./client
        run: |
          godot --headless --export-release "Windows Desktop" build/desktop/${EXPORT_NAME}.exe

      - name: Smoke-test Windows artifact with Wine
        working-directory: ./client
        run: |
          wine build/desktop/${EXPORT_NAME}.exe --headless --quit

      - name: Generate Windows release manifest
        run: |
          bash tools/ci/generate_release_manifest.sh "Windows Desktop" client/build/desktop client/build/desktop/release-manifest-windows.json
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-realms-windows
          path: client/build/desktop/
          retention-days: 7

  export-web:
    name: Export Web
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    env:
      EXPECTED_TEMPLATE: web_release.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Godot export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/${EXPECTED_TEMPLATE} ]; then
            echo "Downloading Godot ${GODOT_VERSION} export templates..."
            curl -fSL -o Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
              || { echo "FAILED: curl exit code $?"; ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/; exit 1; }
            echo "Verifying ZIP archive..."
            unzip -tq Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            echo "Extracting..."
            unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
            test -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt
            test -f /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/${EXPECTED_TEMPLATE}
          else
            echo "Export templates already present, skipping download."
            ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi
      
      - name: Export Web
        working-directory: ./client
        run: |
          godot --headless --export-release "Web" build/web/index.html

      - name: Generate Web release manifest
        run: |
          bash tools/ci/generate_release_manifest.sh "Web" client/build/web client/build/web/release-manifest-web.json
      
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-realms-web
          path: client/build/web/
          retention-days: 7

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Boot smoke (project loads, autoloads init)
        working-directory: ./client
        run: |
          godot --headless --path . --quit 2>&1
      
      - name: Run test_runner (core assertions; fails build on any failure)
        working-directory: ./client
        run: |
          godot --headless --path . -s res://tests/test_runner.gd 2>&1

      - name: Run release catalog contract test
        working-directory: ./client
        run: |
          godot --headless --path . -s res://tests/test_release_catalogs.gd 2>&1
      
      - name: Run comprehensive_validation (no false positives)
        working-directory: ./client
        run: |
          godot --headless -s res://tests/comprehensive_validation.gd 2>&1
      
      - name: Run multiplayer integration test
        working-directory: ./client
        run: |
          godot --headless -s res://tests/test_multiplayer_integration.gd 2>&1
